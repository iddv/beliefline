name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no dependencies; the README's start command needs only Python)
        run: |
          pip install pytest
          pip install .
      - name: Unit tests
        run: python3 -m unittest tests.test_beliefline -v
      - name: Acceptance tests
        run: |
          if [ -d tests/acceptance ]; then ln -sfn tests/acceptance/_helpers _helpers; python -m pytest tests/acceptance; rm _helpers; fi
          if [ -d acceptance/findings ]; then ln -sfn acceptance/findings/_verify _verify; python -m pytest acceptance/findings; rm _verify; fi
